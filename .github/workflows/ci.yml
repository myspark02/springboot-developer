# 워크플로의 이름 지정
name: CI/CD

# 워크플로가 시작될 조건 지정
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # 실행 환경 지정

# 실행 스텝 지정
    steps:
      # 1. 버전 v3 -> v4로 업그레이드
      - uses: actions/checkout@v4.0.0

      # 2. 버전 v3 -> v4로 업그레이드
      - uses: actions/setup-java@v4.0.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build